[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77.0",
]

[project]
authors = [
    { email = "johannes.programming@gmail.com", name = "Johannes" },
]
classifiers = [
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "datahold>=3.0,<4",
    "frozendict>=2.4.6,<3",
]
description = "This project provides holders for JSON data."
keywords = []
license = "MIT"
license-files = [
    "LICENSE.txt",
]
name = "jsonhold"
readme = "README.rst"
requires-python = ">=3.12"
version = "0.1.0"

[project.urls]
Download = "https://pypi.org/project/jsonhold/#files"
Index = "https://pypi.org/project/jsonhold/"
Source = "https://github.com/johannes-programming/jsonhold/"
Website = "https://jsonhold.johannes-programming.online/"

[tool.mypy]
files = [
    ".",
]
python_version = "3.12"
strict = true
